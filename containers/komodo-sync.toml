[[stack]]
name = "homeAutomation"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/homeAutomation.yaml"]
environment = """
# Environment for the `homeAutomation` Komodo stack (containers/homeAutomation.yaml).
# Embedded by `ft komodo-sync`. No secrets in this stack.

TZ=UTC

# Zigbee coordinator device on the host — adjust to your dongle
# (e.g. /dev/serial/by-id/usb-... for a stable path).
ZIGBEE_DEVICE=/dev/ttyUSB0
"""

[[stack]]
name = "media"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/media.yaml"]
environment = """
# Environment for the `media` Komodo stack (containers/media.yaml).
#
# `ft komodo-sync` embeds this file as the stack's `environment`, so every
# ${VAR} in the compose resolves. Values here are NOT secret. Real secret
# values live in the Periphery [secrets] block (var/secrets/komodo.yaml, key
# komodo/periphery_secrets); this file only references them by name via [[KEY]].
# See containers/komodo-gitops-setup.md.

# --- IDs / locale (safe defaults; adjust to taste) ---
PUID=1000
PGID=1000
TZ=UTC

# --- Storage root ---
# Single root all *arr/media services nest under (config/<service>, tv,
# movies, downloads). Docker creates missing subdirectories on first run.
# Point this at a bind mount or pool path; falls back to
# /opt/containers/media if unset.
MEDIA_ROOT=/opt/containers/media

# --- Gluetun VPN (NOT secret, but you MUST fill these for your account) ---
# Provider slug, e.g. mullvad, protonvpn, airvpn — see gluetun's wiki.
VPN_SERVICE_PROVIDER=
VPN_TYPE=wireguard
# The WireGuard address your provider assigned, e.g. 10.64.0.2/32.
WIREGUARD_ADDRESSES=

# --- Secrets: real values go in komodo/periphery_secrets, never here ---
WIREGUARD_PRIVATE_KEY=[[WIREGUARD_PRIVATE_KEY]]
ARIA2_RPC_SECRET=[[ARIA2_RPC_SECRET]]
"""

[[stack]]
name = "observability"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/observability.yaml"]
environment = """
# Environment for the `observability` Komodo stack (containers/observability.yaml).
# Embedded by `ft komodo-sync`. No secrets in this stack.

# Docker socket the observability agents read for container metrics/logs.
CONTAINER_SOCKET=/var/run/docker.sock
"""
