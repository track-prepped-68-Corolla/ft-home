# Mosquitto 2.x requires an explicit listener and authentication policy.
# Copy this file to /opt/containers/home-automation/mosquitto/config/mosquitto.conf
# on the host before starting the homeAutomation stack.

# Bind to all interfaces inside the container on port 1883 (MQTT) and 9001 (WS).
listener 1883
listener 9001
protocol websockets

# Allow unauthenticated connections from localhost / internal Docker network.
# Replace with a password_file directive if you want credential-based auth.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
