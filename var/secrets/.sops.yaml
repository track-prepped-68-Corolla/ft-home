keys:
  # Machine host key — decrypts at boot via SSH host ed25519 key.
  # Derive with: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
  - &strix    age1PLACEHOLDER_STRIX_AGE_PUBKEY

  # YubiKey PIV key — used to encrypt/edit secrets and optionally decrypt at boot.
  # Derive with: age-plugin-yubikey --generate --slot 1  then  age-plugin-yubikey --list
  - &yubikey  age1yubikey1PLACEHOLDER_YUBIKEY_AGE_PUBKEY

creation_rules:
  - path_regex: secrets\.yaml$
    key_groups:
      - age: [*strix, *yubikey]
