name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for trufflehog secret scanning.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v14

      # Runs checks.<system>.{format,lint} generated by ft-home's lib.mkFlake.
      # format: treefmt (nixfmt + deadnix)    lint: statix
      # Binary substitutes are fetched from cache.nixos.org.
      - name: nix flake check
        run: nix flake check

      # Evaluate all NixOS configurations to their derivation path without
      # building. Fails immediately if any configuration cannot be evaluated.
      - name: Evaluate NixOS configurations
        run: |
          nix eval --json '.#nixosConfigurations' \
            --apply 'builtins.mapAttrs (_: m: m.config.system.build.toplevel.drvPath)'

      # Trufflehog scans git history for secrets; runs outside the Nix sandbox
      # where the full git tree is available.
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
