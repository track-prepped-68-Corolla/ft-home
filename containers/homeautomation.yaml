services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /srv/host-share/containers/home-automation/config:/config
    environment:
      - TZ=${TZ:-UTC}

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - ha-net
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - /srv/host-share/containers/home-automation/mosquitto/data:/mosquitto/data
      - /srv/host-share/containers/home-automation/mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 12 > /dev/null 2>&1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  # zigbee2mqtt — DISABLED until a Zigbee coordinator dongle is passed through
  # into strix-dvm (the microVM has no USB device, so the container can't
  # start). To re-enable: add USB passthrough for the dongle to
  # vms/strix-dvm, set ZIGBEE_DEVICE in homeautomation.env, uncomment below,
  # then re-run `ft komodo-sync`.
  # zigbee2mqtt:
  #   image: koenkk/zigbee2mqtt:latest
  #   container_name: zigbee2mqtt
  #   restart: unless-stopped
  #   networks:
  #     - ha-net
  #   ports:
  #     - "127.0.0.1:8082:8080"   # 8080 = gluetun/qbittorrent, 8081 = cadvisor
  #   volumes:
  #     - /srv/host-share/containers/home-automation/zigbee2mqtt:/app/data
  #   devices:
  #     - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:${ZIGBEE_DEVICE:-/dev/ttyUSB0}
  #   environment:
  #     - TZ=${TZ:-UTC}
  #   depends_on:
  #     mosquitto:
  #       condition: service_healthy

networks:
  ha-net:
    name: ha-net
