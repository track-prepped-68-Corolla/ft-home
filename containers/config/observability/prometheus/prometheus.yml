global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # OTel Collector Prometheus exporter — metrics forwarded from instrumented apps
  - job_name: otelcol
    static_configs:
      - targets: ['otelcol:8889']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor listens on 8080 inside the container (mapped to 8081 on the host)
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
