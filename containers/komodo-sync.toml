# Generated by `ft komodo-sync` from containers/*.yaml — do not edit by hand.
# Re-run `ft komodo-sync` after adding or removing a compose file, then commit.

[[resource_sync]]
name = "ft-home-stacks"
[resource_sync.config]
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
resource_path = ["containers/komodo-sync.toml"]
managed = false

[[stack]]
name = "ai"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/ai.yaml"]
environment = """
# Environment for the `ai` Komodo stack (containers/ai.yaml).
#
# `ft komodo-sync` embeds this file as the stack's `environment`. Values here
# are NOT secret; real secret values live in the Periphery [secrets] block
# (var/secrets/komodo.yaml, key komodo/periphery_secrets) and are referenced by
# name via [[KEY]]. See containers/komodo-gitops-setup.md.

# --- Lemonade (runs natively on strix, ft.amdAi) ---
# strix's microvm0 bridge address (ft.microvms.hostAddress) + Lemonade's port.
LEMONADE_BASE_URL=http://10.0.100.1:13305/api/v1
# Model name exactly as registered in Lemonade (`lemonade-server list`).
# Can also be picked later in AnythingLLM's UI.
LEMONADE_MODEL=
LEMONADE_CONTEXT_WINDOW=32768

# --- SearXNG ---
# Public URL (Caddy path on the tailnet) — SearXNG builds its links from it.
SEARXNG_BASE_URL=http://strix-dvm/searxng/

# --- Secrets: real values go in komodo/periphery_secrets, never here ---
SEARXNG_SECRET=[[SEARXNG_SECRET]]
ANYTHINGLLM_JWT_SECRET=[[ANYTHINGLLM_JWT_SECRET]]
"""

[[stack]]
name = "discoverability"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/discoverability.yaml"]
environment = """
# Environment for the `discoverability` Komodo stack (containers/discoverability.yaml).
# Embedded by `ft komodo-sync`.

# Persistent state root (Caddy certs/config, Homarr appdata) on the host share.
DISCOVERABILITY_ROOT=/srv/host-share/containers/discoverability

# --- Secrets: real values go in komodo/periphery_secrets, never here ---
# Generate with: openssl rand -hex 32
HOMARR_SECRET_ENCRYPTION_KEY=[[HOMARR_SECRET_ENCRYPTION_KEY]]
"""

[[stack]]
name = "homeautomation"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/homeautomation.yaml"]
environment = """
# Environment for the `homeautomation` Komodo stack (containers/homeautomation.yaml).
# Embedded by `ft komodo-sync`. No secrets in this stack.

TZ=UTC

# Zigbee coordinator device on the host — adjust to your dongle
# (e.g. /dev/serial/by-id/usb-... for a stable path).
ZIGBEE_DEVICE=/dev/ttyUSB0
"""

[[stack]]
name = "media"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/media.yaml"]
environment = """
# Environment for the `media` Komodo stack (containers/media.yaml).
#
# `ft komodo-sync` embeds this file as the stack's `environment`, so every
# ${VAR} in the compose resolves. Values here are NOT secret. Real secret
# values live in the Periphery [secrets] block (var/secrets/komodo.yaml, key
# komodo/periphery_secrets); this file only references them by name via [[KEY]].
# See containers/komodo-gitops-setup.md.

# --- IDs / locale (safe defaults; adjust to taste) ---
PUID=1000
PGID=1000
TZ=UTC

# --- Storage root ---
# Single root all *arr/media services nest under (config/<service>, tv,
# movies, downloads). Docker creates missing subdirectories on first run.
# Point this at a bind mount or pool path; falls back to
# /srv/host-share/containers/media if unset.
MEDIA_ROOT=/srv/host-share/containers/media

# --- Gluetun VPN (NOT secret, but you MUST fill these for your account) ---
# Provider slug, e.g. mullvad, protonvpn, airvpn — see gluetun's wiki.
VPN_SERVICE_PROVIDER=
VPN_TYPE=wireguard
# The WireGuard address your provider assigned, e.g. 10.64.0.2/32.
WIREGUARD_ADDRESSES=

# --- Secrets: real values go in komodo/periphery_secrets, never here ---
WIREGUARD_PRIVATE_KEY=[[WIREGUARD_PRIVATE_KEY]]
ARIA2_RPC_SECRET=[[ARIA2_RPC_SECRET]]
"""

[[stack]]
name = "observability"
deploy = true
[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "track-prepped-68-Corolla"
repo = "track-prepped-68-Corolla/ft-home"
branch = "testing"
file_paths = ["containers/observability.yaml"]
environment = """
# Environment for the `observability` Komodo stack (containers/observability.yaml).
# Embedded by `ft komodo-sync`.

# Docker socket the observability agents read for container metrics/logs.
CONTAINER_SOCKET=/var/run/docker.sock

# Public URL Grafana builds links/redirects from (Caddy path on the tailnet).
GRAFANA_ROOT_URL=http://strix-dvm/grafana/

# --- Secrets: real values go in komodo/periphery_secrets, never here ---
# Grafana's compose entry fails fast (`:?`) if this is empty.
GF_SECURITY_ADMIN_PASSWORD=[[GRAFANA_ADMIN_PASSWORD]]
"""
