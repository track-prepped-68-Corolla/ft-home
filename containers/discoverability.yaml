networks:
  homelab-network:
    name: homelab-network
    driver: bridge

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config comes straight from the repo; state lives on the persistent
      # host share (the microVM's root filesystem is wiped on restart).
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DISCOVERABILITY_ROOT:-/srv/host-share/containers/discoverability}/caddy/data:/data
      - ${DISCOVERABILITY_ROOT:-/srv/host-share/containers/discoverability}/caddy/config:/config
    networks:
      - homelab-network

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    # Not published: Caddy proxies to it over homelab-network.
    volumes:
      - ${DISCOVERABILITY_ROOT:-/srv/host-share/containers/discoverability}/homarr:/appdata
    environment:
      # Homarr 1.x refuses to start without a 64-hex-char encryption key.
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    networks:
      - homelab-network
