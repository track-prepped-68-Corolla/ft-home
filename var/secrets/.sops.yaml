keys:
  # Host-key recipients — derive: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
  # (or `ft secrets-init <host>`). &strix and &lyra are real and in use; &mimir is
  # still a placeholder until that host exists.
  - &strix age1w54t7qkf3lvveefmpzgqs9snckuyujg90rddq7x63plat8qnzchqnklr7d
  - &mimir age1PLACEHOLDER_MIMIR_AGE_PUBKEY
  - &lyra age1ah2gt59e7etkdqzxp4ntnpk7ulvgset6ddh8x3g5czzr6qmy0fpq95p0uc

  # YubiKey PIV slot — NOT the sk-ssh-ed25519 FIDO2 key used for SSH/login.
  # Portable: decrypts on any host the key is plugged into.
  # Derive via: age-plugin-yubikey --generate (then `age-plugin-yubikey --list`
  # to print the recipient of an already-provisioned identity).  PLACEHOLDER.
  - &yubikey age1yubikeyPLACEHOLDER_AGE_PUBKEY

  # TPM-sealed identities — PER MACHINE (sealed to that box's TPM; NOT shared, so
  # there is one recipient per host, not a single &tpm). On each host:
  #   age-plugin-tpm --generate -o /var/lib/sops-nix/key.txt
  #   age-plugin-tpm -y /var/lib/sops-nix/key.txt   # prints the recipient
  # Replace the placeholder, add the anchor to creation_rules below, then run:
  #   sops updatekeys var/secrets/secrets.yaml
  # PLACEHOLDERS until generated on the respective machine.
  - &strix_tpm age1tpmPLACEHOLDER_STRIX_AGE_PUBKEY
  - &lyra_tpm age1tpmPLACEHOLDER_LYRA_AGE_PUBKEY

creation_rules:
  # Only REAL recipients may appear here — a placeholder is not a valid age key and
  # breaks `sops updatekeys`/encryption. As you generate each, add &yubikey,
  # &strix_tpm, &lyra_tpm here and re-run `sops updatekeys var/secrets/secrets.yaml`.
  - path_regex: var/secrets/.*\.yaml$
    key_groups:
      - age: [*strix, *lyra]
