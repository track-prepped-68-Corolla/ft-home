name: Tag Claude on CodeRabbit Review

on:
  pull_request_review:
    types: [submitted]

jobs:
  tag-claude-on-coderabbit-review:
    if: github.event.review.user.login == 'coderabbitai[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Tag Claude (respecting cycle limit)
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_CYCLES = 5;
            const pr_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });

            const tagged = comments.filter(c =>
              c.user.type === 'Bot' &&
              c.body.includes('<!-- claude-auto-tag -->')
            );

            if (tagged.length >= MAX_CYCLES) {
              core.notice(`Cycle limit of ${MAX_CYCLES} reached for PR #${pr_number}. Skipping.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: `<!-- claude-auto-tag -->\n@claude CodeRabbit has submitted a review. Please address the feedback and push a fix.`,
            });
