# Copy to /opt/containers/observability/tempo/tempo.yml before first run.
# OTel Collector forwards traces to Tempo via OTLP (internal ports 4317/4318).
# Grafana queries Tempo on port 3200.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
