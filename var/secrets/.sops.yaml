keys:
  # Machine keys (derived via: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub)
  # Run: just secrets-init <hostname>  to generate and add a host key
  - &strix   age1PLACEHOLDER_STRIX_AGE_PUBKEY
  - &mimir   age1PLACEHOLDER_MIMIR_AGE_PUBKEY

  # YubiKey PIV slot — NOT the sk-ssh-ed25519 FIDO2 key used for SSH/login.
  # Derive via: age-plugin-yubikey --generate (then `age-plugin-yubikey --list`
  # to print the recipient of an already-provisioned identity)
  - &yubikey age1yubikeyPLACEHOLDER_AGE_PUBKEY

  # TPM-sealed identity (strix) — derive via: age-plugin-tpm --generate -o <file>
  # then `age-plugin-tpm -y <file>` to print the recipient
  - &tpm     age1tpmPLACEHOLDER_AGE_PUBKEY

creation_rules:
  - path_regex: var/secrets/.*\.yaml$
    key_groups:
      - age: [*strix, *mimir, *yubikey, *tpm]
