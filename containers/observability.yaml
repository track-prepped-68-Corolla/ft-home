services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:3200:3200"   # HTTP query (Grafana datasource)
    volumes:
      - ./config/observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otelcol
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:4317:4317"   # gRPC OTLP receiver
      - "127.0.0.1:4318:4318"   # HTTP OTLP receiver
      - "127.0.0.1:8889:8889"   # Prometheus exporter (scraped by Prometheus)
    volumes:
      - ./config/observability/otelcol:/etc/otelcol:ro
    command: --config /etc/otelcol/config.yaml
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      # Bound to all interfaces: reachable only over Tailscale, since the
      # host's ft.tailscale.enable trusts tailscale0 in the firewall while
      # port 3000 stays closed on every other interface.
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/observability/loki:/etc/loki:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config/observability/alloy:/etc/alloy:ro
      - /var/log:/var/log:ro
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:8081:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro   # provides unified cgroup v2 hierarchy under /sys/fs/cgroup
      - /var/lib/docker:/var/lib/docker:ro

networks:
  monitoring-net:
    name: monitoring-net

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
