name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject repoPath for Nix evaluation
        run: |
          mkdir -p var/local
          printf '%s' "$GITHUB_WORKSPACE" > var/local/repoPath
          git add -f var/local/repoPath

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # Update ft-home to the latest testing commit so the formatter and
      # statix fixes are available. Followers (nixpkgs, home-manager,
      # nixos-facter) update automatically via their follows constraints.
      - name: Update ft-home input
        shell: bash
        run: nix flake update ft-home 2>&1 | tee /tmp/ci-update.log; exit ${PIPESTATUS[0]}

      # Auto-format via treefmt (nixfmt + deadnix) and commit if anything changed.
      - name: Auto-format (treefmt)
        shell: bash
        run: |
          nix fmt 2>&1 | tee /tmp/ci-fmt.log
          FMT_EXIT=${PIPESTATUS[0]}
          if [ $FMT_EXIT -ne 0 ]; then exit $FMT_EXIT; fi
          if ! git diff --quiet; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -am "style: auto-format"
          fi

      # Push the flake.lock update and/or auto-format commit (if either step
      # produced one) back to the branch that triggered this run. Without
      # this, the lock advance only ever lives in the ephemeral runner and
      # the repo's committed flake.lock never catches up. A no-op `git push`
      # exits 0, so this is safe to run even when nothing changed.
      - name: Push CI auto-fixes
        shell: bash
        run: git push origin HEAD:"${{ github.head_ref || github.ref_name }}"

      # Runs checks.<system>.{format,lint} defined by the framework.
      - name: nix flake check
        shell: bash
        run: nix flake check 2>&1 | tee /tmp/ci-check.log; exit ${PIPESTATUS[0]}

      # Evaluate all NixOS configurations to their derivation path without
      # building. Fails immediately if any configuration cannot be evaluated.
      - name: Evaluate NixOS configurations
        shell: bash
        run: |
          nix eval --json '.#nixosConfigurations' \
            --apply 'builtins.mapAttrs (_: m: m.config.system.build.toplevel.drvPath)' \
            2>&1 | tee /tmp/ci-eval.log; exit ${PIPESTATUS[0]}

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Tag Claude on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const MAX_CYCLES = 5;
            const pr_number = context.payload.pull_request.number;
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const allComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              per_page: 100,
            });

            const tagged = allComments.filter(c =>
              c.user.type === 'Bot' &&
              c.body?.includes('<!-- claude-auto-tag -->')
            );

            if (tagged.length >= MAX_CYCLES) {
              core.notice(`Cycle limit of ${MAX_CYCLES} reached for PR #${pr_number}. Skipping.`);
              return;
            }

            const logFiles = {
              'Update ft-home input': '/tmp/ci-update.log',
              'Auto-format (treefmt)': '/tmp/ci-fmt.log',
              'nix flake check': '/tmp/ci-check.log',
              'Evaluate NixOS configurations': '/tmp/ci-eval.log',
            };

            const MAX_LOG_CHARS = 6000;
            let logSection = '';
            for (const [stepName, logPath] of Object.entries(logFiles)) {
              try {
                let content = fs.readFileSync(logPath, 'utf8').trim();
                if (content) {
                  if (content.length > MAX_LOG_CHARS) {
                    content = '...(truncated)\n' + content.slice(-MAX_LOG_CHARS);
                  }
                  const safeContent = content.replace(/```/g, '``\\`');
                  logSection += `\n<details>\n<summary>${stepName}</summary>\n\n\`\`\`\n${safeContent}\n\`\`\`\n</details>\n`;
                }
              } catch (err) {
                core.notice(`Unable to read ${logPath}: ${err.message}`);
              }
            }

            const body = `<!-- claude-auto-tag -->\n@claude CI failed on this PR. Please investigate the [failed run](${run_url}), identify the root cause, and push a fix.${logSection ? '\n\n### Error Logs\n' + logSection : ''}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body,
            });
