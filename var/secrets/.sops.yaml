keys:
  # Machine keys (derived via: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub)
  # Run: just secrets-init <hostname>  to generate and add a host key
  - &strix  age1PLACEHOLDER_STRIX_AGE_PUBKEY

  # User keys (derived via: ssh-to-age -i ~/.ssh/id_ed25519)
  - &joe    age1PLACEHOLDER_JOE_AGE_PUBKEY

  # Admin/recovery key (keep offline, for emergency re-encryption)
  - &admin  age1PLACEHOLDER_ADMIN_AGE_PUBKEY

creation_rules:
  - path_regex: secrets/shared/.*\.yaml$
    key_groups:
      - age: [*strix, *admin]

  - path_regex: secrets/hosts/strix/.*\.yaml$
    key_groups:
      - age: [*strix, *admin]

  - path_regex: secrets/users/joe/.*\.yaml$
    key_groups:
      - age: [*joe, *admin]
