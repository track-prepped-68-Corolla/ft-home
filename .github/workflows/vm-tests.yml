name: VM Smoke Tests

on:
  workflow_dispatch:

jobs:
  vm-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # GitHub's ubuntu-latest runners have /dev/kvm but it needs 0666
      # permissions so the Nix build sandbox can access it.
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      # Pick up the latest framework commit from the testing branch.
      - name: Update ft-home input
        run: nix flake update ft-home

      - name: Run VM smoke tests
        run: |
          nix build -L --no-link \
            --option system-features "nixos-test kvm benchmark big-parallel" \
            .#vm-core-boot \
            .#vm-tailscale-load \
            .#vm-podman-rootless-load \
            .#vm-printing-load \
            .#vm-keepass-load \
            .#vm-nix-index-load \
            .#vm-virt-load \
            .#vm-nfs-framework-load \
            .#vm-cli-load \
            .#vm-apps-load \
            .#vm-mullet-load \
            .#vm-facter-load \
            .#vm-nfs-consumer-load \
            .#vm-rclone-load \
            .#vm-local-ai-load \
            .#vm-wine-load \
            .#vm-ssh-load
