name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Auto-format via treefmt (nixfmt + deadnix) and commit if anything changed.
      - name: Auto-format (treefmt)
        run: |
          nix fmt \
            --override-input ft-home \
            "github:track-prepped-68-corolla/fast-track-nix?ref=claude/disable-statix-repeated-keys-5Agt3"
          if ! git diff --quiet; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -am "style: auto-format"
          fi

      # Runs checks.<system>.{format,lint} via the feature branch of fast-track-nix.
      # Revert --override-input once both PRs are merged to testing.
      - name: nix flake check
        run: |
          nix flake check \
            --override-input ft-home \
            "github:track-prepped-68-corolla/fast-track-nix?ref=claude/disable-statix-repeated-keys-5Agt3"

      # Evaluate all NixOS configurations to their derivation path without
      # building. Fails immediately if any configuration cannot be evaluated.
      - name: Evaluate NixOS configurations
        run: |
          nix eval --json '.#nixosConfigurations' \
            --override-input ft-home \
            "github:track-prepped-68-corolla/fast-track-nix?ref=claude/disable-statix-repeated-keys-5Agt3" \
            --apply 'builtins.mapAttrs (_: m: m.config.system.build.toplevel.drvPath)'

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
