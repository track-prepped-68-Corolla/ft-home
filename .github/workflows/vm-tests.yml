name: VM Smoke Tests

on:
  workflow_dispatch:

jobs:
  vm-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # GitHub's ubuntu-latest runners have /dev/kvm but it needs 0666
      # permissions so the Nix build sandbox can access it.
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      # Pick up the latest framework commit from the testing branch.
      - name: Update ft-home input
        run: nix flake update ft-home

      - name: vm-core-boot
        run: |
          nix build -L --no-link \
            --option system-features "nixos-test kvm benchmark big-parallel" \
            .#vm-core-boot

      - name: vm-tailscale-load
        run: |
          nix build -L --no-link \
            --option system-features "nixos-test kvm benchmark big-parallel" \
            .#vm-tailscale-load
