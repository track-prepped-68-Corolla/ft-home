"$schema" = 'https://starship.rs/config-schema.json'

# --- SINGLE LINE LAYOUT ---
format = "$directory$git_branch$git_status$python$nodejs$rust$golang$lua$cmd_duration$character"

palette = "catppuccin_mocha"

[directory]
style = "bold fg:lavender"
truncation_length = 5
truncation_symbol = "…/"
home_symbol = "󱂵 ~"
read_only = " 󰌾"
use_os_path_sep = true
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](bold fg:teal) "
error_symbol = "[❯](bold fg:red) "

[git_branch]
symbol = "󰊢 "
style = "bold fg:mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold fg:red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2_000
style = "fg:yellow"
format = "took [$duration]($style) "

[python]
symbol = "󱔎 "
style = "fg:teal"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = "󰎙 "
style = "fg:green"
format = "via [$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "fg:maroon"
format = "via [$symbol$version]($style) "

[golang]
symbol = "󰟓 "
style = "fg:sapphire"
format = "via [$symbol$version]($style) "

[lua]
symbol = "󰢱 "
style = "fg:blue"
format = "via [$symbol$version]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
