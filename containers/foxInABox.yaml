services:
  fox-in-the-box:
    image: ghcr.io/fox-in-the-box-ai/cloud:stable
    container_name: fox-in-the-box
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ~/.foxinthebox:/data