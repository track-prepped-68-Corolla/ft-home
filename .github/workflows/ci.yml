name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for trufflehog secret scanning.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Runs checks.<system>.{format,lint} using the feature branch of
      # fast-track-nix, which includes the statix config fix and the
      # disabled = [20] statix.toml. Revert to `nix flake update ft-home`
      # once both PRs are merged to testing.
      - name: nix flake check
        run: |
          nix flake check \
            --override-input ft-home \
            "github:track-prepped-68-corolla/fast-track-nix?ref=claude/disable-statix-repeated-keys-5Agt3"

      # Evaluate all NixOS configurations to their derivation path without
      # building. Fails immediately if any configuration cannot be evaluated.
      - name: Evaluate NixOS configurations
        run: |
          nix eval --json '.#nixosConfigurations' \
            --override-input ft-home \
            "github:track-prepped-68-corolla/fast-track-nix?ref=claude/disable-statix-repeated-keys-5Agt3" \
            --apply 'builtins.mapAttrs (_: m: m.config.system.build.toplevel.drvPath)'

      # Trufflehog scans git history for secrets; runs outside the Nix sandbox
      # where the full git tree is available.
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
